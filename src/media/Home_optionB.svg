<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <linearGradient id="adlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4040FF"/>
      <stop offset="100%" style="stop-color:#6B6BFF"/>
    </linearGradient>
  </defs>

  <!-- Fondo blanco puro -->
  <rect width="900" height="540" fill="#ffffff"/>
  <!-- Barra superior ADL -->
  <rect x="0" y="0" width="900" height="5" fill="url(#adlGrad)"/>
  <!-- Círculos decorativos -->
  <circle cx="730" cy="260" r="270" fill="#f0f0ff" opacity="0.45"/>
  <circle cx="730" cy="260" r="170" fill="#e8e8ff" opacity="0.4"/>

  <!-- Logo ADL oficial -->
  <image style="mix-blend-mode:multiply" href="data:image/png;base64," x="52" y="36" width="140" height="88"/>

  <!-- Badge DevOps -->
  <rect x="68" y="132" width="70" height="22" rx="11" fill="#4040FF"/>
  <text x="103" y="147" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DevOps</text>

  <!-- IAM IDENTITY CENTER -->
  <text x="52" y="182" font-family="Arial, sans-serif" font-size="11.5" fill="#9090b0" letter-spacing="3" font-weight="500">IAM IDENTITY CENTER</text>

  <!-- Titulo -->
  <text x="52" y="228" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" fill="#0a1628">Temporary</text>
  <text x="52" y="278" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" fill="#0a1628">Elevated Access</text>
  <text x="52" y="328" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" fill="#4040FF">Management</text>

  <!-- Acento -->
  <rect x="52" y="344" width="70" height="4" rx="2" fill="url(#adlGrad)"/>

  <!-- Descripcion -->
  <text x="52" y="378" font-family="Arial, sans-serif" font-size="13.5" fill="#687078">Automated, approval-based workflow for managing</text>
  <text x="52" y="398" font-family="Arial, sans-serif" font-size="13.5" fill="#687078">time-bound elevated access to your AWS environment.</text>

  <!-- Card 1 -->
  <rect x="492" y="108" width="376" height="82" rx="16" fill="#f5f5ff" stroke="#d0d0ff" stroke-width="1.5"/>
  <rect x="510" y="130" width="42" height="42" rx="21" fill="#4040FF" opacity="0.10"/>
  <text x="531" y="157" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">&#x1F512;</text>
  <text x="570" y="140" font-family="Arial Black, sans-serif" font-size="14" font-weight="800" fill="#0a1628">Approval Workflow</text>
  <text x="570" y="158" font-family="Arial, sans-serif" font-size="12" fill="#687078">Request, approve and audit access</text>
  <text x="570" y="174" font-family="Arial, sans-serif" font-size="12" fill="#687078">with a full audit trail</text>

  <!-- Card 2 -->
  <rect x="492" y="204" width="376" height="82" rx="16" fill="#f5f5ff" stroke="#d0d0ff" stroke-width="1.5"/>
  <rect x="510" y="226" width="42" height="42" rx="21" fill="#4040FF" opacity="0.10"/>
  <text x="531" y="253" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">&#x23F1;</text>
  <text x="570" y="236" font-family="Arial Black, sans-serif" font-size="14" font-weight="800" fill="#0a1628">Time-bound Access</text>
  <text x="570" y="254" font-family="Arial, sans-serif" font-size="12" fill="#687078">Sessions expire automatically after</text>
  <text x="570" y="270" font-family="Arial, sans-serif" font-size="12" fill="#687078">the defined duration</text>

  <!-- Card 3 -->
  <rect x="492" y="300" width="376" height="82" rx="16" fill="#f5f5ff" stroke="#d0d0ff" stroke-width="1.5"/>
  <rect x="510" y="322" width="42" height="42" rx="21" fill="#4040FF" opacity="0.10"/>
  <text x="531" y="349" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">&#x1F4CA;</text>
  <text x="570" y="332" font-family="Arial Black, sans-serif" font-size="14" font-weight="800" fill="#0a1628">Full Audit Logs</text>
  <text x="570" y="350" font-family="Arial, sans-serif" font-size="12" fill="#687078">Correlate justification with session</text>
  <text x="570" y="366" font-family="Arial, sans-serif" font-size="12" fill="#687078">activity across all accounts</text>

  <!-- Card 4 -->
  <rect x="492" y="396" width="376" height="82" rx="16" fill="#f5f5ff" stroke="#d0d0ff" stroke-width="1.5"/>
  <rect x="510" y="418" width="42" height="42" rx="21" fill="#4040FF" opacity="0.10"/>
  <text x="531" y="445" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">&#x1F465;</text>
  <text x="570" y="428" font-family="Arial Black, sans-serif" font-size="14" font-weight="800" fill="#0a1628">SSO Integration</text>
  <text x="570" y="446" font-family="Arial, sans-serif" font-size="12" fill="#687078">SAML-based single sign-on with</text>
  <text x="570" y="462" font-family="Arial, sans-serif" font-size="12" fill="#687078">Cognito group-based authorization</text>

  <!-- Barra inferior -->
  <rect x="0" y="534" width="900" height="6" fill="url(#adlGrad)" opacity="0.95"/>
</svg>