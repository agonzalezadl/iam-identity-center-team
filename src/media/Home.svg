<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2240;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c9a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#112240;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00c9a7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>

  <!-- Grid pattern subtle -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.2" opacity="0.08"/>
  </pattern>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Decorative circles background -->
  <circle cx="750" cy="80" r="120" fill="none" stroke="#00c9a7" stroke-width="0.5" opacity="0.15"/>
  <circle cx="750" cy="80" r="80" fill="none" stroke="#00c9a7" stroke-width="0.5" opacity="0.15"/>
  <circle cx="750" cy="80" r="40" fill="#00c9a7" opacity="0.05"/>
  <circle cx="120" cy="420" r="90" fill="none" stroke="#0080ff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="120" cy="420" r="50" fill="none" stroke="#0080ff" stroke-width="0.5" opacity="0.1"/>

  <!-- Left side content -->
  <!-- ADL Logo area -->
  <rect x="60" y="60" width="4" height="60" rx="2" fill="url(#accentGrad)"/>

  <!-- ADL text logo -->
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3">ADL</text>
  <text x="80" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#00c9a7" letter-spacing="4">DIGITAL LAB</text>

  <!-- Divider line -->
  <line x1="60" y1="145" x2="420" y2="145" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4"/>

  <!-- DevOps badge -->
  <rect x="60" y="160" width="90" height="26" rx="13" fill="url(#accentGrad)" opacity="0.9"/>
  <text x="105" y="177" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">DevOps</text>

  <!-- Main title -->
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#8892b0" letter-spacing="3">IAM IDENTITY CENTER</text>
  <text x="60" y="285" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Temporary</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Elevated</text>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="36" font-weight="900">
    <tspan fill="url(#accentGrad)">Access</tspan>
    <tspan fill="#ffffff"> Mgmt</tspan>
  </text>

  <!-- Description -->
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="13" fill="#8892b0">Automated, approval-based workflow for</text>
  <text x="60" y="433" font-family="Arial, sans-serif" font-size="13" fill="#8892b0">elevating user permissions on AWS</text>

  <!-- Right side illustration -->
  <!-- Main card/screen -->
  <rect x="490" y="80" width="360" height="340" rx="16" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.95"/>
  <rect x="490" y="80" width="360" height="340" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Card header bar -->
  <rect x="490" y="80" width="360" height="50" rx="16" fill="#0a1628" opacity="0.8"/>
  <rect x="490" y="106" width="360" height="24" fill="#0a1628" opacity="0.8"/>

  <!-- Window dots -->
  <circle cx="518" cy="105" r="6" fill="#ff5f57"/>
  <circle cx="538" cy="105" r="6" fill="#febc2e"/>
  <circle cx="558" cy="105" r="6" fill="#28c840"/>

  <!-- Tab bar text -->
  <text x="590" y="110" font-family="Arial, sans-serif" font-size="11" fill="#8892b0">TEAM · Access Portal</text>

  <!-- Shield icon center -->
  <g transform="translate(610, 145)" filter="url(#glow)">
    <path d="M60,10 L110,30 L110,70 C110,95 85,115 60,125 C35,115 10,95 10,70 L10,30 Z" fill="url(#accentGrad)" opacity="0.15"/>
    <path d="M60,10 L110,30 L110,70 C110,95 85,115 60,125 C35,115 10,95 10,70 L10,30 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- Check mark inside shield -->
    <path d="M38,65 L53,80 L82,48" fill="none" stroke="#00c9a7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Access request cards -->
  <rect x="510" y="295" width="150" height="60" rx="8" fill="#0a1628" opacity="0.9"/>
  <rect x="510" y="295" width="150" height="60" rx="8" fill="none" stroke="#00c9a7" stroke-width="1" opacity="0.4"/>
  <circle cx="530" cy="315" r="8" fill="#00c9a7" opacity="0.2"/>
  <circle cx="530" cy="315" r="4" fill="#00c9a7"/>
  <rect x="545" y="309" width="100" height="8" rx="4" fill="#8892b0" opacity="0.4"/>
  <rect x="545" y="322" width="70" height="6" rx="3" fill="#00c9a7" opacity="0.3"/>
  <rect x="510" y="340" width="150" height="3" rx="2" fill="url(#accentGrad)" opacity="0.6"/>
  <text x="520" y="352" font-family="Arial, sans-serif" font-size="9" fill="#00c9a7">✓ APPROVED</text>

  <rect x="680" y="295" width="150" height="60" rx="8" fill="#0a1628" opacity="0.9"/>
  <rect x="680" y="295" width="150" height="60" rx="8" fill="none" stroke="#0080ff" stroke-width="1" opacity="0.4"/>
  <circle cx="700" cy="315" r="8" fill="#0080ff" opacity="0.2"/>
  <circle cx="700" cy="315" r="4" fill="#0080ff"/>
  <rect x="715" y="309" width="100" height="8" rx="4" fill="#8892b0" opacity="0.4"/>
  <rect x="715" y="322" width="80" height="6" rx="3" fill="#0080ff" opacity="0.3"/>
  <rect x="680" y="340" width="150" height="3" rx="2" fill="#0080ff" opacity="0.6"/>
  <text x="690" y="352" font-family="Arial, sans-serif" font-size="9" fill="#0080ff">⏳ PENDING</text>

  <!-- Connecting lines between elements -->
  <line x1="585" y1="200" x2="620" y2="240" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="730" y1="200" x2="700" y2="240" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- Bottom accent line -->
  <rect x="0" y="492" width="900" height="8" rx="0" fill="url(#accentGrad)" opacity="0.8"/>

  <!-- Floating particles -->
  <circle cx="450" cy="150" r="3" fill="#00c9a7" opacity="0.6"/>
  <circle cx="470" cy="200" r="2" fill="#0080ff" opacity="0.5"/>
  <circle cx="440" cy="320" r="2" fill="#00c9a7" opacity="0.4"/>
  <circle cx="460" cy="380" r="3" fill="#0080ff" opacity="0.5"/>
</svg>
