<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <linearGradient id="adlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c9a7"/>
      <stop offset="100%" style="stop-color:#0080ff"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="900" height="540" fill="#ffffff"/>

  <!-- ═══════════════════════════════ -->
  <!-- LEFT SIDE CONTENT              -->
  <!-- ═══════════════════════════════ -->

  <!-- ADL Logo — top left -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="3.5" height="50" rx="1.5" fill="url(#adlGrad)"/>
    <text x="14" y="22" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#0a1628" letter-spacing="2">ADL</text>
    <text x="14" y="38" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#00c9a7" letter-spacing="4">DIGITAL LAB</text>
  </g>

  <!-- DevOps badge -->
  <rect x="54" y="86" width="68" height="20" rx="10" fill="url(#adlGrad)"/>
  <text x="88" y="100" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DevOps</text>

  <!-- Divider line -->
  <line x1="40" y1="116" x2="380" y2="116" stroke="url(#adlGrad)" stroke-width="0.8" opacity="0.25"/>

  <!-- IAM IDENTITY CENTER label -->
  <text x="40" y="148" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#687078" letter-spacing="2">IAM Identity Center</text>

  <!-- Main title — 4 lines to fit full text -->
  <text x="40" y="185" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#16191f">Temporary</text>
  <text x="40" y="233" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#16191f">Elevated</text>
  <text x="40" y="281" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#16191f">Access</text>
  <text x="40" y="329" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#adlGrad)">Management</text>

  <!-- Space for button at top:330px -->

  <!-- Description -->
  <text x="40" y="390" font-family="Arial, sans-serif" font-size="13" fill="#687078">Automated, approval-based workflow for elevating user</text>
  <text x="40" y="408" font-family="Arial, sans-serif" font-size="13" fill="#687078">permission on AWS</text>

  <!-- Space reserved for React button -->

  <!-- ═══════════════════════════════ -->
  <!-- RIGHT SIDE ILLUSTRATION        -->
  <!-- ═══════════════════════════════ -->

  <!-- Main screen card -->
  <rect x="490" y="40" width="370" height="310" rx="14" fill="#f8f9ff" stroke="#e3e8f0" stroke-width="1.5"/>
  <!-- Browser bar -->
  <rect x="490" y="40" width="370" height="36" rx="14" fill="#edf0f8"/>
  <rect x="490" y="62" width="370" height="14" fill="#edf0f8"/>
  <!-- Browser dots -->
  <circle cx="512" cy="58" r="5.5" fill="#ff6b6b"/>
  <circle cx="529" cy="58" r="5.5" fill="#ffd93d"/>
  <circle cx="546" cy="58" r="5.5" fill="#6bcb77"/>
  <text x="572" y="62" font-family="Arial, sans-serif" font-size="10" fill="#9ba5b5">TEAM · Access Portal</text>

  <!-- Screen content -->
  <rect x="515" y="95" width="220" height="10" rx="5" fill="#dde3f0"/>
  <rect x="515" y="115" width="170" height="8" rx="4" fill="#eaecf5"/>
  <rect x="515" y="133" width="190" height="8" rx="4" fill="#eaecf5"/>

  <!-- Shield security icon -->
  <path d="M670 155 L705 167 L705 192 C705 210 687.5 221 670 227 C652.5 221 635 210 635 192 L635 167 Z" fill="url(#adlGrad)" opacity="0.12"/>
  <path d="M670 155 L705 167 L705 192 C705 210 687.5 221 670 227 C652.5 221 635 210 635 192 L635 167 Z" fill="none" stroke="url(#adlGrad)" stroke-width="2"/>
  <path d="M657 191 L666 200 L685 177" fill="none" stroke="#00c9a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Approved card -->
  <rect x="505" y="250" width="160" height="62" rx="9" fill="#ffffff" stroke="#e0e8f0" stroke-width="1"/>
  <circle cx="527" cy="271" r="8" fill="#00c9a7" opacity="0.15"/>
  <circle cx="527" cy="271" r="4.5" fill="#00c9a7"/>
  <rect x="542" y="265" width="105" height="8" rx="4" fill="#dde3f0"/>
  <rect x="542" y="278" width="75" height="6" rx="3" fill="#eaecf5"/>
  <rect x="505" y="298" width="160" height="3" rx="1.5" fill="url(#adlGrad)" opacity="0.7"/>
  <text x="514" y="308" font-family="Arial, sans-serif" font-size="9" fill="#00c9a7" font-weight="700">✓ APPROVED</text>

  <!-- Pending card -->
  <rect x="685" y="250" width="160" height="62" rx="9" fill="#ffffff" stroke="#e0e8f0" stroke-width="1"/>
  <circle cx="707" cy="271" r="8" fill="#0080ff" opacity="0.15"/>
  <circle cx="707" cy="271" r="4.5" fill="#0080ff"/>
  <rect x="722" y="265" width="105" height="8" rx="4" fill="#dde3f0"/>
  <rect x="722" y="278" width="85" height="6" rx="3" fill="#eaecf5"/>
  <rect x="685" y="298" width="160" height="3" rx="1.5" fill="#0080ff" opacity="0.5"/>
  <text x="694" y="308" font-family="Arial, sans-serif" font-size="9" fill="#0080ff" font-weight="700">⏳ PENDING</text>

  <!-- Person sitting at desk -->
  <ellipse cx="410" cy="370" rx="55" ry="20" fill="#f0f2f8"/>
  <circle cx="410" cy="325" r="22" fill="#dde3f0"/>
  <path d="M375 365 Q410 345 445 365 L450 400 L370 400 Z" fill="#dde3f0"/>
  <rect x="382" y="385" width="56" height="28" rx="5" fill="#c5cfe8"/>
  <rect x="386" y="388" width="48" height="20" rx="3" fill="#8aa0d0"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="534" width="900" height="6" rx="0" fill="url(#adlGrad)" opacity="0.9"/>
</svg>
